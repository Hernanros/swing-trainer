name: Deploy to Railway

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: |
          bash <(curl -fsSL cli.new/install) -y
          echo "$HOME/.railway/bin" >> $GITHUB_PATH
      - name: Deploy
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 63b6014d-7946-44ed-93af-f0cd509555da
          RAILWAY_SERVICE_ID: fa7fd2c4-de6d-480f-9901-d79a056f9084
